name: AI Bot
on:
  issues:
    types: [opened]

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_MODE: ai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
