name: AI Code Review & Rewrite

on:
  push:
    branches: [ main ]
    paths:
      - "**/*.cs"

jobs:
  ai-refactor:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude SDK
        run: npm install @anthropic-ai/sdk

      - name: Run AI refactor script
        run: node .github/ai-refactor.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "AI auto-refactor" || echo "No changes to commit"
          git push
